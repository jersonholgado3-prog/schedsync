<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accounts - SchedSync</title>
  <link rel="stylesheet" href="header-styles.css" />
  <link rel="stylesheet" href="admin-theme.css" />
  <link rel="stylesheet" href="facultypage_styles.css" />
  <script>
    (function () {
      const theme = localStorage.getItem("theme");
      if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
      const uiMode = localStorage.getItem("uiMode");
      const userRole = localStorage.getItem("userRole");
      const mode = uiMode || ((userRole === 'teacher' || userRole === 'admin') ? 'professional' : 'student');
      if (mode === 'professional') document.documentElement.classList.add("professional-mode");
      if (userRole === "admin") document.documentElement.classList.add("admin-theme");
    })();
  </script>
  <script type="module" src="role-restriction.js"></script>
  <script type="module" src="accounts.js"></script>
  <style>
    body { margin: 0; font-family: 'Poppins', sans-serif; }
    .container { display: flex; height: 100vh; overflow: hidden; }
    .main-content-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .page-content { flex: 1; overflow-y: auto; padding: 2rem; background: var(--bg-main, #f1f5f9); }

    .accounts-toolbar {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .accounts-toolbar input[type="search"] {
      flex: 1; min-width: 200px; padding: 0.55rem 1rem;
      border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem;
      background: var(--card-bg, #fff); color: var(--text-main, #1e293b);
      outline: none;
    }
    .accounts-toolbar select {
      padding: 0.55rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 0.9rem; background: var(--card-bg, #fff); color: var(--text-main, #1e293b);
      cursor: pointer;
    }
    .btn-add {
      padding: 0.55rem 1.4rem; background: #3b82f6; color: #fff;
      border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; white-space: nowrap;
    }
    .btn-add:hover { background: #2563eb; }

    .accounts-table-wrap { background: var(--card-bg, #fff); border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th { background: #f8fafc; padding: 0.85rem 1rem; text-align: left; font-weight: 700; color: #64748b; border-bottom: 1.5px solid #e2e8f0; }
    tbody td { padding: 0.8rem 1rem; border-bottom: 1px solid #f1f5f9; color: var(--text-main, #1e293b); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    .role-badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700; text-transform: capitalize;
    }
    .role-badge.admin { background: #fee2e2; color: #dc2626; }
    .role-badge.academic_head { background: #ede9fe; color: #7c3aed; }
    .role-badge.teacher { background: #dbeafe; color: #2563eb; }
    .role-badge.student { background: #dcfce7; color: #16a34a; }

    .action-btn { background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
    .role-select { padding: 3px 8px; border: 1.5px solid #e2e8f0; border-radius: 6px; font-size: 0.8rem; font-weight: 600; background: var(--card-bg,#fff); color: var(--text-main,#1e293b); cursor: pointer; }
    .action-btn.reset { color: #3b82f6; }
    .action-btn.reset:hover { background: #dbeafe; }
    .action-btn.delete { color: #ef4444; }
    .action-btn.delete:hover { background: #fee2e2; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 6000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--card-bg, #fff); border-radius: 16px;
      padding: 2rem; width: 100%; max-width: 440px; box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .modal-box h3 { margin: 0 0 1.5rem; font-size: 1.1rem; font-weight: 800; color: var(--text-main, #1e293b); }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
    .form-group input, .form-group select {
      padding: 0.6rem 0.9rem; border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 0.9rem; background: var(--bg-main, #f8fafc); color: var(--text-main, #1e293b);
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel { padding: 0.55rem 1.2rem; background: #e2e8f0; color: #475569; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-save { padding: 0.55rem 1.4rem; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

    .empty-state { text-align: center; padding: 3rem; color: #94a3b8; font-size: 0.95rem; }
    .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .online-dot.online { background: #22c55e; }
    .online-dot.offline { background: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-header" onclick="window.location.href='homepage.html'">
        <img src="images/LOGO.png" alt="Logo">
      </div>
      <nav class="sidebar-menu">
        <a href="homepage.html" class="sidebar-link"><img src="images/HOME.png" alt="Home"><span>Home</span></a>
        <a href="myschedule.html" class="sidebar-link"><img src="images/SCHED.png" alt="My Schedule"><span>My Schedule</span></a>
        <a href="facultypage.html" class="sidebar-link"><img src="images/FACULTY.png" alt="Faculty"><span>Faculty</span></a>
        <a href="campuspage.html" class="sidebar-link"><img src="images/CAMPUS_ONE.png" alt="Rooms"><span>Rooms</span></a>
        <a href="sectionspage.html" class="sidebar-link"><img src="images/SECTIONS.png" alt="Sections"><span>Sections</span></a>
        <a href="event.html" class="sidebar-link"><img src="images/EVENT_MODE.png" alt="Events"><span>Events</span></a>
        <a href="curriculumpage.html" class="sidebar-link"><img src="images/CURRICULUM.png" alt="Curriculum"><span>Curriculum</span></a>
        <div id="adminSidebarLinks" style="display: none;">
          <a href="archives.html" class="sidebar-link"><img src="images/ARCHIVE.png" alt="Archives"><span>Archives</span></a>
          <a href="audit_logs.html" class="sidebar-link"><img src="images/AUDIT.png" alt="Audit Logs"><span>Audit Logs</span></a>
          <a href="accounts.html" class="sidebar-link active"><img src="images/PROFILE.png" alt="Accounts"><span>Accounts</span></a>
        </div>
      </nav>
    </aside>

    <div class="main-content-wrapper">
      <header class="header">
        <div class="left-header">
          <div class="hamburger-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </div>
          <div class="search-wrapper">
            <img src="images/SEARCH.png" class="search-icon" alt="Search">
            <input type="search" class="search-button" placeholder="Search" aria-label="Search" autocomplete="off">
          </div>
        </div>
        <div class="page-title">Accounts</div>
        <div class="user-section">
          <div class="notification-icon-wrapper" onclick="window.openGameNotifications()">
            <img src="images/BELL.png" alt="Notifications">
          </div>
          <div class="user-profile-btn" id="userProfile">
            <span class="burger-icon">☰</span>
            <div class="user-name">User</div>
            <div class="user-avatar" id="headerAvatar">
              <img src="images/default_shark.jpg" alt="User" style="width:100%;height:100%;object-fit:cover;">
            </div>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="accounts-toolbar">
          <input type="search" id="accountSearch" placeholder="Search by name or email...">
          <select id="roleFilter">
            <option value="">All Roles</option>
            <option value="admin">Admin</option>
            <option value="academic_head">Academic Head</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
          </select>
          <button class="btn-add" id="addAccountBtn">+ New Account</button>
        </div>

        <div class="accounts-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name / Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="accountsTableBody">
              <tr><td colspan="4" class="empty-state">Loading accounts...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- New Account Modal -->
  <div class="modal-overlay" id="newAccountModal">
    <div class="modal-box">
      <h3>New Account</h3>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="newName" placeholder="Juan Dela Cruz" maxlength="80">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="newEmail" placeholder="email@example.com" maxlength="100">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="newPassword" placeholder="Min. 6 characters" maxlength="100">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="newRole">
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
          <option value="academic_head">Academic Head</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelNewAccount">Cancel</button>
        <button class="btn-save" id="saveNewAccount">Create Account</button>
      </div>
    </div>
  </div>

  <script type="module" src="realtime-notifications.js"></script>
  <script type="module" src="ui-effects.js"></script>
</body>
</html>
