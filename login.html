<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchedSync - Login</title>
  <script>
    (function () {
      // 1. Theme Lock 🌙 - Always Light for Login
      document.documentElement.classList.remove("dark");

      // 2. UI Mode Lock 👔
      const uiMode = localStorage.getItem("uiMode");
      const userRole = localStorage.getItem("userRole");
      const mode = uiMode || ((userRole === 'teacher' || userRole === 'admin') ? 'professional' : 'student');
      if (mode === 'professional') {
        document.documentElement.classList.add("professional-mode");
      }
    })();
  </script>
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="container">
    <header class="header">
    </header>

    <main class="login-container">
      <h2>Login now</h2>

      <div id="notification" class="notification"></div>

      <form id="loginForm">
        <label for="username">Email or Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" name="password" required>
          <div class="password-toggle" id="togglePassword">
            <svg xmlns="http://www.w3.org/2000/svg" class="eye-off" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>

        <a href="forgotpass.html" class="forgot-password">Forgot Password?</a>
        <button type="submit">Log In</button>
      </form>

      <div style="margin-top: 1.5rem; margin-bottom: 1.5rem;" class="divider"></div>

      <div style="text-align:center;">
        <button id="openAdminLogin" style="background:none;border:none;color:#64748b;font-size:0.82rem;cursor:pointer;text-decoration:underline;">🔐 Admin Login</button>
      </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:16px;padding:2rem;width:90%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,0.18);">
        <h3 style="margin:0 0 1.2rem;font-size:1.1rem;font-weight:800;">🔐 Admin Login</h3>
        <div id="adminNotif" style="display:none;margin-bottom:1rem;padding:0.6rem 1rem;border-radius:8px;font-size:0.85rem;font-weight:600;"></div>
        <form id="adminLoginForm">
          <label style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#64748b;">Password</label>
          <div class="password-input-wrapper" style="margin-top:0.35rem;">
            <input type="password" id="adminPassword" placeholder="Enter your password" required
              style="width:100%;padding:0.65rem 1rem;border:1.5px solid #e2e8f0;border-radius:8px;font-size:0.95rem;box-sizing:border-box;">
          </div>
          <button type="submit" style="margin-top:1.2rem;width:100%;padding:0.75rem;background:#1e293b;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:0.95rem;cursor:pointer;">Sign In</button>
        </form>
        <button onclick="document.getElementById('adminLoginModal').style.display='none'"
          style="margin-top:0.75rem;width:100%;padding:0.6rem;background:none;border:1.5px solid #e2e8f0;border-radius:10px;font-weight:600;font-size:0.85rem;cursor:pointer;color:#64748b;">Cancel</button>
      </div>
    </div>

    <script>
      document.getElementById('openAdminLogin').addEventListener('click', () => {
        document.getElementById('adminLoginModal').style.display = 'flex';
        document.getElementById('adminNotif').style.display = 'none';
        document.getElementById('adminPassword').value = '';
      });
    </script>
  </div>

  <script type="module" src="login.js" defer></script>
  <script type="module" src="ui-effects.js"></script>
</body>

</html>
