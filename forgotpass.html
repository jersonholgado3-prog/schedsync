<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      // 1. Theme Lock 🌙 - Always Light for Auth Pages
      document.documentElement.classList.remove("dark");

      // 2. UI Mode Lock 👔
      const uiMode = localStorage.getItem("uiMode");
      const userRole = localStorage.getItem("userRole");
      const mode = uiMode || ((userRole === 'teacher' || userRole === 'admin') ? 'professional' : 'student');
      if (mode === 'professional') {
        document.documentElement.classList.add("professional-mode");
      }
    })();
  </script>
  <link rel="stylesheet" href="forgotpass_styles.css" />
  <script type="module" src="login.js" defer></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "ef82a79a-5e7a-4a5f-83a6-e2b90b8302c9",
        promptOptions: { slidedown: { prompts: [{ type: "push", autoPrompt: true, text: { actionMessage: "SchedSync wants to send you schedule updates.", acceptButton: "Allow", cancelButton: "No Thanks" }, delay: { pageViews: 1, timeDelay: 2 } }] } }
      });
    });
  </script>
</head>

<body>
  <h2 class="page-title">Reset Password</h2>
  <div class="forgot-container">
    <div id="notification" class="notification"></div>
    <form id="forgotPasswordForm">
      <label for="email">Enter your Email</label>
      <input type="email" id="email" required>
      <button type="submit">Send Reset Link</button>
    </form>
    <a href="login.html" class="back-link">Back to Log In</a>
  </div>
  <script type="module" src="ui-effects.js"></script>
</body>

</html>
